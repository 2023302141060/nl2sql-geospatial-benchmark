table_name: usa_static
table_description: 美国静态环境变量数据表（包含太阳能光伏发电潜力、风速、地形坡度、数字高程模型DEM、陆上石油潜力等自然环境指标，以及行政区划层级、省/州名称、ID等基础信息）
domain: 美国
spatiotemporal_properties:
  spatial_granularity: 州级面要素
  temporal_granularity: 静态
  has_geometry: false
columns:
- name: asdf_id
  type: BIGINT
  description: 空间单元唯一标识
  is_primary_key: true
  foreign_key: usa_spatial_base.asdf_id
- name: pvout_mean
  type: DOUBLE PRECISION
  description: 光伏发电潜力/日照输出均值
  aliases: [光伏潜力, 光伏发电潜力, 太阳能潜力, photovoltaic potential]
- name: windspeed_mean
  type: DOUBLE PRECISION
  description: 平均风速
  aliases: [平均风速, 风速, wind speed, mean wind speed]
- name: slope_mean
  type: DOUBLE PRECISION
  description: 平均坡度
- name: elevation_mean
  type: DOUBLE PRECISION
  description: 平均海拔高度
  aliases: [平均海拔, 海拔, 平均高程, mean elevation]
- name: onshore_petroleum_mean
  type: DOUBLE PRECISION
  description: 行政区内“存在陆上油气储藏”的面积比例
  aliases: [陆上油气储藏面积比例, 油气储藏面积比例, 陆上油气储藏比例, onshore petroleum area proportion]
- name: Level
  type: TEXT
  description: 行政区划级别
  enums:
  - ADM1
- name: gqid
  type: BIGINT
  description: GeoQuery 内部几何/区域 ID
