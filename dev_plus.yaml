- question_id: 6
  domain: usa
  question: 以纽约州几何质心为基准，找出州域边界到该质心的最短大地线距离不超过 500 公里的所有空间单元，再计算这些空间单元 2012 年城市建设用地占比的平均值。
  difficulty: hard
  requires_sandbox: true
  expected_sql_plan:
    queries:
    - sql: |
        SELECT geometry AS ny_geom FROM usa_spatial_base WHERE "shapeName" = 'New York';
      output_filename: ny_data.geojson
      has_geometry: true
    - sql: |
        SELECT s."shapeName", s.geometry, l.proportion 
        FROM usa_spatial_base s 
        JOIN usa_landcover_annual_proportion l ON s.asdf_id = l.asdf_id 
        WHERE l.year = 2012 AND l.category = 'urban_and_builtup';
      output_filename: states_data.geojson
      has_geometry: true
  expected_python_code: |
    import geopandas as gpd
    from pyproj import Geod

    ny_gdf = gpd.read_file("ny_data.geojson")
    states_gdf = gpd.read_file("states_data.geojson")

    # 保持 WGS84，用大地线距离：州边界任意点到纽约质心的最小距离 ≤ 500km 即纳入
    geod = Geod(ellps='WGS84')
    ny_centroid = ny_gdf.geometry.centroid.iloc[0]

    def min_dist_km_to_boundary(geom):
        if geom is None or geom.is_empty:
            return float('inf')
        if ny_centroid.within(geom):
            return 0.0
        coords = []
        if geom.geom_type == 'Polygon':
            coords = list(geom.exterior.coords)
        elif geom.geom_type == 'MultiPolygon':
            for p in geom.geoms:
                coords.extend(p.exterior.coords)
        if not coords:
            return float('inf')
        min_m = min(geod.inv(ny_centroid.x, ny_centroid.y, lon, lat)[2] for lon, lat in coords)
        return min_m / 1000

    states_gdf['min_dist_km'] = states_gdf.geometry.apply(min_dist_km_to_boundary)
    intersecting_states = states_gdf[states_gdf['min_dist_km'] <= 500]

    avg_proportion = intersecting_states['proportion'].mean()
    print({"avg_urban_proportion": avg_proportion, "states_included": intersecting_states['shapeName'].tolist()})
  expected_execution_result:
    exact_match_sql_rows: false
    data_payload_subset:
      avg_urban_proportion: 0.11437654484730508
      states_included:
        - West Virginia
        - Maryland
        - Rhode Island
        - New Hampshire
        - Vermont
        - Connecticut
        - Delaware
        - New Jersey
        - Pennsylvania
        - Ohio
        - Maine
        - New York
        - Massachusetts
        - Virginia
        - District of Columbia

- question_id: 7
  domain: usa
  question: 把平均坡度大于 5 的美国各州，按几何中心位置分成 3 类空间聚类。
  difficulty: hard
  requires_sandbox: true
  expected_sql_plan:
    queries:
    - sql: |
        SELECT s."shapeName", s.geometry, st.slope_mean 
        FROM usa_spatial_base s 
        JOIN usa_static st ON s.asdf_id = st.asdf_id 
        WHERE st.slope_mean > 5;
      output_filename: high_slope_states.geojson
      has_geometry: true
  expected_python_code: |
    import geopandas as gpd
    from sklearn.cluster import KMeans

    gdf = gpd.read_file("high_slope_states.geojson")

    # 提取多边形质心经纬度用于聚类
    centroids = gdf.geometry.centroid
    coords = list(zip(centroids.x, centroids.y))

    # KMeans 聚类
    kmeans = KMeans(n_clusters=3, random_state=42)
    gdf['cluster'] = kmeans.fit_predict(coords)

    print(gdf[['shapeName', 'cluster']].to_dict(orient='records'))
  expected_execution_result:
    exact_match_sql_rows: false
    data_payload_subset:
      - shapeName: Idaho
        cluster: 2
      - shapeName: Washington
        cluster: 2
      - shapeName: Hawaii
        cluster: 0
      - shapeName: Commonwealth of the Northern Mariana Islands
        cluster: 1
      - shapeName: Alaska
        cluster: 2
      - shapeName: American Samoa
        cluster: 0

- question_id: 8
  domain: usa
  question: 找出和德克萨斯州接壤的所有州，并统计它们在 2020 年上半年的 NDVI 总和。
  difficulty: hard
  requires_sandbox: true
  expected_sql_plan:
    queries:
    - sql: |
        SELECT s."shapeName", s.geometry, SUM(m.ndvi_mean) AS total_ndvi
        FROM usa_spatial_base s 
        JOIN usa_env_metrics_monthly_2020 m ON s.asdf_id = m.asdf_id 
        WHERE m.month BETWEEN 1 AND 6
        GROUP BY s."shapeName", s.geometry;
      output_filename: states_ndvi.geojson
      has_geometry: true
  expected_python_code: |
    import geopandas as gpd

    gdf = gpd.read_file("states_ndvi.geojson")

    # 获取德州的几何体
    texas_geom = gdf[gdf['shapeName'] == 'Texas'].geometry.iloc[0]

    # 使用 touches() 判断拓扑接壤
    neighbors = gdf[gdf.geometry.touches(texas_geom)]

    print({"neighbors_ndvi_sum": neighbors[['shapeName', 'total_ndvi']].to_dict('records')})
  expected_execution_result:
    exact_match_sql_rows: false
    data_payload_subset:
      neighbors_ndvi_sum:
        - shapeName: Arkansas
          total_ndvi: 29706.30473276184
        - shapeName: Louisiana
          total_ndvi: 24149.05242594624
        - shapeName: New Mexico
          total_ndvi: 14914.497097491565
        - shapeName: Oklahoma
          total_ndvi: 24641.858417309337

