- question_id: 18
  domain: zhejiang
  question: 找出 2012 到 2022 年间浙江省土地覆盖类型发生变化的所有渔网格，并计算这些网格变化后的总实际面积。
  difficulty: hard
  requires_sandbox: true
  expected_sql_plan:
    queries:
    - sql: |
        SELECT 
            cell_id, 
            geometry, 
            area_ratio 
        FROM zhejiang_fishnet
        WHERE geometry IS NOT NULL;
      output_filename: zhejiang_fishnet_base.geojson
      has_geometry: true
    - sql: |
        SELECT 
            cell_id, 
            landcover_igbp 
        FROM zhejiang_fishnet_dynamic 
        WHERE year = 2012 AND landcover_igbp IS NOT NULL;
      output_filename: landcover_2012.json
      has_geometry: false
    - sql: |
        SELECT 
            cell_id, 
            landcover_igbp 
        FROM zhejiang_fishnet_dynamic 
        WHERE year = 2022 AND landcover_igbp IS NOT NULL;
      output_filename: landcover_2022.json
      has_geometry: false
  expected_python_code: |
    import json
    import geopandas as gpd
    import pandas as pd
    import traceback

    try:
        # 1. 读取基础渔网格空间数据
        grid_gdf = gpd.read_file("zhejiang_fishnet_base.geojson")

        # 2. 分别读取 2012 和 2022 年的土地覆盖属性数据
        df_2012 = pd.read_json("landcover_2012.json", orient="records")
        df_2022 = pd.read_json("landcover_2022.json", orient="records")

        # 3. 按 cell_id 关联起止年份数据，并寻找真正发生变迁的网格 (2012 != 2022)
        df_merged = df_2012.merge(df_2022, on="cell_id", suffixes=('_2012', '_2022'))
        df_changed = df_merged[df_merged["landcover_igbp_2012"] != df_merged["landcover_igbp_2022"]]

        if df_changed.empty:
            total_area_km2 = 0.0
        else:
            # 4. 将发生变化的属性结果与空间底图关联
            changed_gdf = grid_gdf.merge(df_changed, on="cell_id")

            # 5. 【关键】投影到米制平面坐标系(EPSG:3857)以计算实际面积
            changed_gdf = changed_gdf.to_crs(epsg=3857)

            # 6. 【关键】计算实际物理面积：网格几何面积 * 面积边缘折算权重(area_ratio)
            changed_gdf["actual_area_m2"] = changed_gdf.geometry.area * changed_gdf["area_ratio"]

            # 7. 汇总总面积并转换为平方千米
            total_area_km2 = changed_gdf["actual_area_m2"].sum() / 1e6

        # 8. 输出符合协议的 JSON
        print(json.dumps({
            "status": "ok",
            "answer_text": f"2012年至2022年期间，浙江省土地覆盖类型发生变迁的总实际面积约为 {total_area_km2:.2f} 平方千米。",
            "data_payload": {
                "total_changed_area_km2": float(total_area_km2)
            }
        }, ensure_ascii=False))

    except Exception as e:
        err_msg = str(e) + "\n" + traceback.format_exc()
        print(json.dumps({
            "status": "error",
            "answer_text": err_msg,
            "data_payload": {}
        }, ensure_ascii=False))
  expected_execution_result:
    exact_match_sql_rows: false
    data_payload_subset:
      total_changed_area_km2: 23173.770437829433

