- question_id: 45
  domain: zhejiang
  question: 提取浙江省海拔最高的前 100 个网格在 2012、2017、2022 年的 NDVI 和气温数据，用 Python 分别算每个网格的变化趋势，再算这 100 个网格里植被趋势和气温趋势之间的皮尔逊相关系数。
  difficulty: hard
  requires_sandbox: true
  expected_sql_plan:
    queries:
    - sql: |
        WITH TopDem AS (
            SELECT cell_id 
            FROM zhejiang_fishnet_static 
            ORDER BY dem DESC 
            LIMIT 100
        )
        SELECT t.cell_id, d.year, d.ndvi, d.temperature 
        FROM TopDem t 
        JOIN zhejiang_fishnet_dynamic d ON t.cell_id = d.cell_id 
        WHERE d.year IN (2012, 2017, 2022) 
          AND d.ndvi IS NOT NULL 
          AND d.temperature IS NOT NULL;
      output_filename: top100_dem_time_series.json
      has_geometry: false
  expected_python_code: |
    import pandas as pd
    from scipy.stats import linregress, pearsonr

    df = pd.read_json("top100_dem_time_series.json")
    
    trends = []
    for cell_id, group in df.groupby('cell_id'):
        if len(group) == 3:
            group = group.sort_values('year')
            ndvi_slope = linregress(group['year'], group['ndvi']).slope
            temp_slope = linregress(group['year'], group['temperature']).slope
            trends.append({'ndvi_slope': ndvi_slope, 'temp_slope': temp_slope})
            
    trends_df = pd.DataFrame(trends)
    corr, p_val = pearsonr(trends_df['ndvi_slope'], trends_df['temp_slope'])
