  requires_sandbox: true
  expected_sql_plan:
    queries:
    - sql: |
        SELECT s."shapeName", m.month, m.lst_day_mean 
        FROM usa_env_metrics_monthly_2020 m 
        JOIN usa_spatial_base s ON m.asdf_id = s.asdf_id 
        WHERE m.year = 2020 
        ORDER BY s."shapeName", m.month;
      output_filename: lst_day_monthly_2020.json
