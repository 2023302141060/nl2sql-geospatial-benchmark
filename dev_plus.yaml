- question_id: 200
  domain: zhejiang
  question: 筛选 ESA Tree cover 且三期数据完整的浙江网格。定义稳定性指数为 NDVI 三期均值除以（1 + NDVI 样本变异系数 + 降水样本变异系数），输出指数最高的 3 个网格。
  difficulty: hard
  requires_sandbox: true
  expected_sql_plan:
    queries:
    - sql: |
        SELECT d.cell_id,d.year,d.ndvi,d.precipitation FROM zhejiang_fishnet_dynamic d
                              JOIN zhejiang_fishnet_static s ON d.cell_id=s.cell_id
                              WHERE s.landcover_esa='Tree cover' AND d.year IN (2012,2017,2022)
                                AND d.ndvi IS NOT NULL AND d.precipitation IS NOT NULL;
      output_filename: q200_tree_stability.json
      has_geometry: false
  expected_python_code: |
    import json
    import pandas as pd
    df=pd.read_json("q200_tree_stability.json")
    rows=[]
    for cell_id,g in df.groupby("cell_id"):
        if len(g)!=3:
            continue
        ndvi_mean=g["ndvi"].mean()
        ndvi_cv=g["ndvi"].std(ddof=1)/abs(ndvi_mean)
        precip_mean=g["precipitation"].mean()
        precip_cv=g["precipitation"].std(ddof=1)/abs(precip_mean)
        score=ndvi_mean/(1+ndvi_cv+precip_cv)
        rows.append({"cell_id":int(cell_id),"stability_index":float(score)})
    rows=sorted(rows,key=lambda x:(-x["stability_index"],x["cell_id"]))[:3]
    payload={"top_3_stable_cells":rows}
    answer_text="已输出稳定性指数最高的 3 个 Tree cover 网格。"

    print(json.dumps({
        "status": "ok",
        "answer_text": answer_text,
        "data_payload": payload
    }, ensure_ascii=False))
  expected_execution_result:
    exact_match_sql_rows: false
    data_payload_subset:
      top_3_stable_cells:
      - cell_id: 1028
        stability_index: 0.667917370877973
      - cell_id: 7266
        stability_index: 0.6626892193403864
      - cell_id: 7925
        stability_index: 0.6622098477356398
