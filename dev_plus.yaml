- question_id: 3
  domain: usa
  question: 比较一下 2020 年加州夏季（6、7、8 月）和冬季（1、2、12 月）的平均白天地表温度。
  difficulty: medium
  requires_sandbox: false
  expected_sql_plan:
    queries:
    - sql: |
        SELECT 
          CASE 
            WHEN m.month IN (6, 7, 8) THEN 'Summer' 
            WHEN m.month IN (1, 2, 12) THEN 'Winter' 
          END AS season, 
          AVG(m.lst_day_mean) AS avg_temp
        FROM usa_env_metrics_monthly_2020 m 
        JOIN usa_spatial_base s ON m.asdf_id = s.asdf_id 
        WHERE s."shapeName" = 'California' 
          AND m.month IN (1, 2, 6, 7, 8, 12) 
        GROUP BY 
          CASE 
            WHEN m.month IN (6, 7, 8) THEN 'Summer' 
            WHEN m.month IN (1, 2, 12) THEN 'Winter' 
          END;
      output_filename: california_seasons_2020.json
      has_geometry: false
  expected_python_code: null
  expected_execution_result:
    exact_match_sql_rows: true
    data_payload_subset:
      - season: Summer
        avg_temp: 312.4674091797
      - season: Winter
        avg_temp: 286.6405922613

