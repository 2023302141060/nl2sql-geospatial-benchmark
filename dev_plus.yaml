- question_id: 17
  domain: zhejiang
  question: 构造宁波市行政区外侧 0—10 公里环带，找出与该环带相交的渔网格，并计算这些网格 2012 年降水量的算术平均值。
  difficulty: hard
  requires_sandbox: true
  expected_sql_plan:
    queries:
    - sql: |
        SELECT geometry FROM zhejiang_city WHERE "fullname" = '宁波市';
      output_filename: ningbo_city.geojson
      has_geometry: true
    - sql: |
        SELECT f.cell_id, f.geometry, d.precipitation 
        FROM zhejiang_fishnet f 
        JOIN zhejiang_fishnet_dynamic d ON f.cell_id = d.cell_id 
        WHERE d.year = 2012;
      output_filename: all_fishnet_2012.geojson
      has_geometry: true
  expected_python_code: |
    import json
    import geopandas as gpd

    ningbo_gdf = gpd.read_file("ningbo_city.geojson")
    grids_gdf = gpd.read_file("all_fishnet_2012.geojson")

    # 1. 投影为平面坐标系 (如 EPSG:3857) 以米为单位计算距离
    ningbo_gdf = ningbo_gdf.to_crs(epsg=3857)
    grids_gdf = grids_gdf.to_crs(epsg=3857)

    # 2. 拓扑修复 (防崩溃与边界修正)
    ningbo_gdf.geometry = ningbo_gdf.geometry.make_valid()
    grids_gdf.geometry = grids_gdf.geometry.make_valid()

    ningbo_geom = ningbo_gdf.geometry.iloc[0]
    
    # 3. 构建 10 公里缓冲区并抠除宁波市自身，提取纯环状区域
    buffer_10km = ningbo_geom.buffer(10000)
    ring_area = buffer_10km.difference(ningbo_geom)

