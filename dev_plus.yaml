- question_id: 46
  domain: usa
  question: 提取美国全部空间单元 2012 年的 PM2.5、总人口、光伏潜力、平均风速、平均坡度和城市建设用地占比；先对五个自变量做 Z-Score 标准化，再建立多元线性回归，输出 R-squared 及绝对标准化回归系数最大的特征。
  difficulty: hard
  requires_sandbox: true
  expected_sql_plan:
    queries:
    - sql: |
        SELECT 
            e.asdf_id, 
            e.pm25_mean, 
            e.pop_sum, 
            s.pvout_mean, 
            s.windspeed_mean, 
            s.slope_mean, 
            l.proportion AS urban_prop 
        FROM usa_env_metrics_annual e 
        JOIN usa_static s ON e.asdf_id = s.asdf_id 
        JOIN usa_landcover_annual_proportion l ON e.asdf_id = l.asdf_id 
        WHERE e.year = 2012 
          AND l.year = 2012 
          AND l.category = 'urban_and_builtup';
      output_filename: usa_multivariate_2012.json
      has_geometry: false
  expected_python_code: |
    import pandas as pd
    from sklearn.linear_model import LinearRegression
    from sklearn.metrics import r2_score
    from sklearn.preprocessing import StandardScaler
    import numpy as np

    df = pd.read_json("usa_multivariate_2012.json").dropna()
    features = ['pop_sum', 'pvout_mean', 'windspeed_mean', 'slope_mean', 'urban_prop']
    X = StandardScaler().fit_transform(df[features])
    y = df['pm25_mean']

    model = LinearRegression()
    model.fit(X, y)
    r2 = r2_score(y, model.predict(X))
    
    # 标准化后各自变量量纲一致，可按系数绝对值比较影响强弱
    max_coef_idx = np.argmax(np.abs(model.coef_))
    most_important_feature = features[max_coef_idx]

    print({"r_squared": r2, "most_important_feature": most_important_feature})
  expected_execution_result:
    exact_match_sql_rows: false
    data_payload_subset:
      r_squared: 0.616
      most_important_feature: "slope_mean"

- question_id: 47
  domain: zhejiang
  question: 找出与杭州市行政区相交的所有渔网格，取出其 2012 年和 2022 年气温与夜间灯光。把网格当年气温减去当年杭州市相交网格平均气温定义为 HII，计算各网格 2012—2022 年的 HII 变化和夜间灯光变化，输出 HII 增长最快的网格 ID 及两种变化量的皮尔逊相关系数。
  difficulty: hard
  requires_sandbox: true
  expected_sql_plan:
    queries:
    - sql: |
        SELECT 
          f.cell_id,
          f.geometry,
          d2012.temperature AS temperature_2012,
          d2012.nightlight AS nightlight_2012,
          d2022.temperature AS temperature_2022,
          d2022.nightlight AS nightlight_2022
        FROM zhejiang_fishnet f
        JOIN zhejiang_fishnet_dynamic d2012 
          ON f.cell_id = d2012.cell_id AND d2012.year = 2012
        JOIN zhejiang_fishnet_dynamic d2022 
          ON f.cell_id = d2022.cell_id AND d2022.year = 2022
        JOIN zhejiang_city c 
          ON ST_Intersects(f.geometry, c.geometry)
        WHERE c.fullname = '杭州市';
      output_filename: hangzhou_fishnet_uh_2012_2022.geojson
      has_geometry: true
  expected_python_code: |
    import geopandas as gpd
    import pandas as pd
    from scipy.stats import pearsonr

    # 读取 GeoJSON（SQL 已通过 ST_Intersects 过滤杭州市范围内网格）
    gdf = gpd.read_file("hangzhou_fishnet_uh_2012_2022.geojson")

    # 如果意外包含 city_geometry 列（兼容旧导出），再做一次筛选
    if "city_geometry" in gdf.columns:
        city_geom = gdf["city_geometry"].iloc[0]
        gdf = gdf[gdf.geometry.intersects(city_geom)].copy()
        gdf = gdf.drop(columns=["city_geometry"])

    if gdf.empty:
        raise ValueError("No grids intersect with Hangzhou city boundary.")

    # 转换为长格式，便于后续计算
    df = pd.melt(
        gdf, 
        id_vars=['cell_id'], 
        value_vars=['temperature_2012', 'nightlight_2012', 'temperature_2022', 'nightlight_2022'],
        var_name='var_year', 
        value_name='value'
    )
    df[['variable', 'year']] = df['var_year'].str.rsplit('_', n=1, expand=True)
    df = df.drop(columns=['var_year'])
    df['year'] = df['year'].astype(int)

    # 透视回宽格式
    df = df.pivot(index=['cell_id', 'year'], columns='variable', values='value').reset_index()

    # 计算当年全市（杭州市内筛选网格）平均温度
    yearly_mean_temp = df.groupby('year')['temperature'].transform('mean')
    df['HII'] = df['temperature'] - yearly_mean_temp

    # 计算变化量
    pivot_df = df.pivot(index='cell_id', columns='year', values=['HII', 'nightlight']).dropna()

    delta_HII = pivot_df[('HII', 2022)] - pivot_df[('HII', 2012)]
    delta_NTL = pivot_df[('nightlight', 2022)] - pivot_df[('nightlight', 2012)]

    # 最终输出
    max_delta_hii_cell_id = int(delta_HII.idxmax())
    corr, _ = pearsonr(delta_HII, delta_NTL)

    print({
        "max_delta_hii_cell_id": max_delta_hii_cell_id,
        "hii_ntl_correlation": float(corr)
    })

    # 调试信息（便于验证）
    print({
        "total_grids_in_hangzhou": len(pivot_df),
        "mean_delta_HII": float(delta_HII.mean()),
        "std_delta_HII": float(delta_HII.std())
    })
  expected_execution_result:
    exact_match_sql_rows: false
    data_payload_subset:
      max_delta_hii_cell_id: 1812
      hii_ntl_correlation: 0.182

- question_id: 48
  domain: usa
  question: 提取美国 2010 年各空间单元的人口和太阳能光伏发电潜力数据，去掉空值后，用 Python 分别计算这两项的基尼系数。
  difficulty: hard
  requires_sandbox: true
  expected_sql_plan:
    queries:
    - sql: |
        SELECT e.pop_sum, s.pvout_mean 
        FROM usa_env_metrics_annual e 
        JOIN usa_static s ON e.asdf_id = s.asdf_id 
        WHERE e.year = 2010 
          AND e.pop_sum IS NOT NULL 
          AND s.pvout_mean IS NOT NULL;
      output_filename: usa_gini_2010.json
      has_geometry: false
  expected_python_code: |
    import pandas as pd
    import numpy as np

    def gini(array):
        array = np.array(array, dtype=np.float64)
        array = array.flatten()
        if np.amin(array) < 0:
            array -= np.amin(array)
        array += 0.0000001
        array = np.sort(array)
        index = np.arange(1, array.shape[0] + 1)
        n = array.shape[0]
        return ((np.sum((2 * index - n  - 1) * array)) / (n * np.sum(array)))

    df = pd.read_json("usa_gini_2010.json")
    
    pop_gini = gini(df['pop_sum'].values)
    pvout_gini = gini(df['pvout_mean'].values)
    
    print({"population_gini": pop_gini, "solar_potential_gini": pvout_gini})
  expected_execution_result:
    exact_match_sql_rows: false
    data_payload_subset:
      population_gini: 0.541
      solar_potential_gini: 0.0573

- question_id: 49
  domain: zhejiang
  question: 筛选 ESA 土地覆盖类型为 Tree cover 且 2012、2017、2022 三期数据完整的网格。定义生态恢复力指数为三期 NDVI 的样本方差除以（三期降水量的样本方差 + 0.001），用 Python 计算并输出指数最高的 3 个网格 ID。
  difficulty: hard
  requires_sandbox: true
  expected_sql_plan:
    queries:
    - sql: |
        SELECT d.cell_id, d.ndvi, d.precipitation 
        FROM zhejiang_fishnet_dynamic d 
        JOIN zhejiang_fishnet_static s ON d.cell_id = s.cell_id 
        WHERE s.landcover_esa = 'Tree cover' 
          AND d.year IN (2012, 2017, 2022) 
          AND d.ndvi IS NOT NULL 
          AND d.precipitation IS NOT NULL;
      output_filename: tree_cover_resilience.json
      has_geometry: false
  expected_python_code: |
    import pandas as pd

    df = pd.read_json("tree_cover_resilience.json")
    
    # 筛选出拥有完整3年数据的网格
    valid_cells = df['cell_id'].value_counts()
    valid_cells = valid_cells[valid_cells == 3].index
    df_filtered = df[df['cell_id'].isin(valid_cells)]
    
    resilience_records = []
    for cell_id, group in df_filtered.groupby('cell_id'):
        var_ndvi = group['ndvi'].var()
        var_precip = group['precipitation'].var()
        resilience = var_ndvi / (var_precip + 0.001)
        resilience_records.append({'cell_id': int(cell_id), 'resilience': resilience})
        
    res_df = pd.DataFrame(resilience_records)
    top_3 = res_df.sort_values(by='resilience', ascending=False).head(3)
    
    print({"top_3_resilient_cells": top_3['cell_id'].tolist()})
  expected_execution_result:
    exact_match_sql_rows: false
    data_payload_subset:
      top_3_resilient_cells: [9539, 9276, 4023]

