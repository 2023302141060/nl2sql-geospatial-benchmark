- question_id: 30
  domain: usa
  question: 提取 2012 年美国各州的混合森林占比和 PM2.5 均值，用 Python 按 1.5 倍 IQR 规则找出森林占比特别高或 PM2.5 特别高的州。
  difficulty: hard
  requires_sandbox: true
  expected_sql_plan:
    queries:
    - sql: |
        SELECT s."shapeName", l.proportion as forest_prop, e.pm25_mean
        FROM usa_landcover_annual_proportion l
        JOIN usa_env_metrics_annual e ON l.asdf_id = e.asdf_id
        JOIN usa_spatial_base s ON l.asdf_id = s.asdf_id
        WHERE l.year = 2012 AND e.year = 2012 AND l.category = 'mixed_forest';
      output_filename: forest_pm25_2012.json
      has_geometry: false
  expected_python_code: |
    import pandas as pd

    df = pd.read_json("forest_pm25_2012.json")

    def get_outliers(series):
        Q1 = series.quantile(0.25)
        Q3 = series.quantile(0.75)
        IQR = Q3 - Q1
        return (series > (Q3 + 1.5 * IQR))

    df['forest_outlier'] = get_outliers(df['forest_prop'])
    df['pm25_outlier'] = get_outliers(df['pm25_mean'])

    result = df[df['forest_outlier'] | df['pm25_outlier']]['shapeName'].tolist()
    print({"outlier_states": result})
  expected_execution_result:
    exact_match_sql_rows: false
    data_payload_subset:
      outlier_states: ['New Hampshire', 'Maine']

