- question_id: 71
  domain: usa
  question: 统计 2020 年美国各州白天地表温度最高的月份，并列出加州的结果。
  difficulty: easy
  requires_sandbox: false
  expected_sql_plan:
    queries:
    - sql: |
        SELECT sub."shapeName", sub.month, sub.lst_day_mean
        FROM (
            SELECT s."shapeName", m.month, m.lst_day_mean,
                   ROW_NUMBER() OVER (PARTITION BY s."shapeName" ORDER BY m.lst_day_mean DESC) AS rn
            FROM usa_env_metrics_monthly_2020 m
            JOIN usa_spatial_base s ON m.asdf_id = s.asdf_id
            WHERE m.year = 2020
        ) sub
        WHERE sub.rn = 1 AND sub."shapeName" = 'California';
      output_filename: california_peak_lst_month_2020.json
      has_geometry: false
  expected_python_code: null
  expected_execution_result:
    exact_match_sql_rows: false
    data_payload_subset:
      shapeName: California
      month: 7
      lst_day_mean: 314.034804699

